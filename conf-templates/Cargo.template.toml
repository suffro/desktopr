[package]
name = "%%CARGO_PACKAGE_NAME%%"
version = "%%CARGO_PACKAGE_VERSION%%"
edition = "2021"
default-run = "%%CARGO_PACKAGE_NAME%%"

[target.'cfg(windows)'.dependencies]
tauri-plugin-prevent-default = { version = "3.0.3", features = ["platform-windows"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24"
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_Foundation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
image = "0.25"

[dependencies]
tauri = { version = "2.0.0", features = ["rustls-tls", "tray-icon", "devtools"] }

# Optional plugins (enable via Cargo features)
tauri-plugin-notification = { version = "2.0.0", optional = true }
tauri-plugin-autostart = { version = "2.0.0", optional = true }
tauri-plugin-global-shortcut = { version = "2.0.0", optional = true }
tauri-plugin-updater = { version = "2.0.0", optional = true }
tauri-plugin-persisted-scope = { version = "2.0.0", optional = true }
tauri-plugin-clipboard-manager = { version = "2.0.0", optional = true }
tauri-plugin-dialog = { version = "2.0.0", optional = true }
tauri-plugin-deep-link = { version = "2.0.0", optional = true }
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"], optional = true }
tauri-plugin-prevent-default = { version = "3.0.3", optional = true }
tauri-plugin-shell = "2.0.0"

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
walkdir = "2.5"
bytes = "1"
url = "2"
getrandom = "0.3.3"
chrono = { version = "0.4", features = ["clock"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tokio = { version = "1.47.1", features = ["time", "rt"] }
reqwest = "0.12.23"

# Error handling
anyhow = "1.0"

# WASM runtime (heavy but kept as-is)
wasmtime = "21.0"
wasmtime-wasi = { version = "21.0", features = ["preview1"] }
wasi-common = { version = "21.0", features = ["sync"] }
cap-std = "3.4"

# Helpers
once_cell = "1.19"
rand = { version = "0.8", features = ["std", "std_rng"] }
toml = "0.9.8"

# UUID (fixed inline to avoid TOML parsing issues)
uuid = { version = "1.18.1", features = ["v4"] }

[features]
default = [
    "tauri-plugin-notification",
    "tauri-plugin-autostart",
    "tauri-plugin-global-shortcut",
    "tauri-plugin-updater",
    "tauri-plugin-persisted-scope",
    "tauri-plugin-clipboard-manager",
    "tauri-plugin-dialog",
    "tauri-plugin-deep-link",
    "tauri-plugin-single-instance",
    "tauri-plugin-prevent-default",
]

[profile.release]
opt-level = 2
lto = false
codegen-units = 8
strip = true

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[[bin]]
name = "%%CARGO_PACKAGE_NAME%%"
path = "src/main.rs"