# Verifies the sign action and the build action's sign: false switch against
# real signing tools. Run it by hand after changing either of them.
#
# macOS uses this repository's own Apple credentials, so the notarization jobs
# only work here. Windows needs no secret: it generates a throwaway certificate
# on the runner and trusts it for the length of the job, which is enough to
# prove signtool ran, the signature is valid and the MSIX publisher rule holds.

name: sign-action-test

on: workflow_dispatch

permissions:
  contents: read

jobs:
  sign-a-real-app:
    name: sign and notarize a .app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A minimal but genuine .app: a real Mach-O binary in a real bundle, so
      # codesign and Apple's notary service see what they normally see.
      - name: Build a fixture app
        run: |
          set -euo pipefail
          app="fixture/Example.app"
          mkdir -p "$app/Contents/MacOS"
          printf 'int main(void){return 0;}\n' > "$RUNNER_TEMP/main.c"
          clang -o "$app/Contents/MacOS/Example" "$RUNNER_TEMP/main.c"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Example</string>
            <key>CFBundleIdentifier</key><string>app.desktopr.signfixture</string>
            <key>CFBundleName</key><string>Example</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleVersion</key><string>1.0.0</string>
          </dict>
          </plist>
          PLIST
          echo "Unsigned fixture:"
          codesign -dvv "$app" 2>&1 | head -3 || true

      - name: Sign and notarize
        id: sign
        uses: ./.github/actions/sign
        with:
          artifacts: fixture/Example.app
          apple_certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple_signing_identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple_id: ${{ secrets.APPLE_ID }}
          apple_password: ${{ secrets.APPLE_PASSWORD }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}

      - name: Check the result
        run: |
          set -euo pipefail
          app="fixture/Example.app"
          dmg="${{ steps.sign.outputs.dmg }}"
          test -n "$dmg" || { echo "::error::the action reported no disk image"; exit 1; }
          test -f "$dmg" || { echo "::error::disk image missing: $dmg"; exit 1; }

          echo "--- app signature ---"
          codesign -dvv "$app" 2>&1 | grep -E "Authority|TeamIdentifier|flags"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "::error::the app is not Developer ID signed"; exit 1; }

          echo "--- disk image ---"
          xcrun stapler validate "$dmg" \
            || { echo "::error::the disk image is not notarized and stapled"; exit 1; }
          spctl --assess --type open --context context:primary-signature -vv "$dmg"

  build-without-signing:
    name: build with sign false
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every Apple credential is available to this job, so a build that comes
      # out ad-hoc signed proves the switch wins over the credentials.
      - name: Build
        id: build
        uses: ./
        with:
          app_name: Sign Switch Test
          app_identifier: app.desktopr.signswitch
          app_version: 0.0.3
          sign: false
          smoke_test: false
          upload_artifact: false
          apple_certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple_signing_identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple_id: ${{ secrets.APPLE_ID }}
          apple_password: ${{ secrets.APPLE_PASSWORD }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}

      - name: Check the app is ad-hoc signed, not Developer ID
        run: |
          set -euo pipefail
          dmg="$(find "${{ steps.build.outputs.dist_dir }}" -name '*.dmg' | head -n 1)"
          test -n "$dmg" || { echo "::error::no disk image was produced"; exit 1; }

          mount="$RUNNER_TEMP/mnt"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -readonly >/dev/null
          app="$(find "$mount" -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$app" || { echo "::error::no app inside the disk image"; exit 1; }

          signature="$(codesign -dvv "$app" 2>&1 || true)"
          echo "$signature" | grep -E "Signature|Authority" || true
          hdiutil detach "$mount" >/dev/null

          if echo "$signature" | grep -q "Authority=Developer ID Application"; then
            echo "::error::sign: false was ignored, the app is Developer ID signed"
            exit 1
          fi
          echo "$signature" | grep -q "Signature=adhoc" \
            || { echo "::error::expected an ad-hoc signature"; exit 1; }
          echo "OK: ad-hoc signed, as sign: false requires"

  sign-on-windows:
    name: sign with a self-signed certificate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A throwaway certificate, trusted on this runner only, so the signature
      # and its chain can be verified the same way a real one would be.
      - name: Create a self-signed certificate
        id: certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $subject = "CN=Desktopr Sign Test"
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $subject `
            -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable `
            -KeyUsage DigitalSignature -NotAfter (Get-Date).AddDays(2)

          $pfx = Join-Path $env:RUNNER_TEMP "test.pfx"
          $cer = Join-Path $env:RUNNER_TEMP "test.cer"
          $password = ConvertTo-SecureString -String "desktopr-test" -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)"

          $base64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfx))
          "certificate=$base64" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "subject=$subject" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Test certificate: $subject"

      - name: Build the fixtures
        shell: pwsh
        env:
          SUBJECT: ${{ steps.certificate.outputs.subject }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing

          function Get-SdkTool([string]$Name) {
            $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter $Name -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $tool) { throw "$Name not found" }
            return $tool.FullName
          }

          New-Item -ItemType Directory -Force -Path fixture | Out-Null

          # A small unsigned executable, built with the compiler that ships with
          # the .NET Framework so nothing has to be installed.
          "class P { static void Main() { } }" | Set-Content -Path "$env:RUNNER_TEMP\p.cs" -Encoding utf8
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe `
            /out:fixture\example.exe "$env:RUNNER_TEMP\p.cs"
          if ($LASTEXITCODE -ne 0) { throw "csc failed ($LASTEXITCODE)" }

          # Two packages: one whose publisher matches the certificate and one
          # whose publisher does not, to prove the action signs only the first.
          function New-Msix([string]$Publisher, [string]$Output) {
            $root = Join-Path $env:RUNNER_TEMP ("msix-" + [IO.Path]::GetFileNameWithoutExtension($Output))
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path "$root/app", "$root/Assets" | Out-Null
            Copy-Item fixture\example.exe "$root/app/"

            foreach ($asset in @(@("StoreLogo.png", 50), @("Square150x150Logo.png", 150), @("Square44x44Logo.png", 44))) {
              $bmp = New-Object System.Drawing.Bitmap($asset[1], $asset[1])
              $bmp.Save("$root/Assets/$($asset[0])", [System.Drawing.Imaging.ImageFormat]::Png)
              $bmp.Dispose()
            }

            @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
            xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
            xmlns:uap10="http://schemas.microsoft.com/appx/manifest/uap/windows10/10"
            xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"
            IgnorableNamespaces="uap10 rescap">
            <Identity Name="Desktopr.SignTest" Publisher="$Publisher" Version="1.0.0.0" ProcessorArchitecture="x64" />
            <Properties>
              <DisplayName>Sign Test</DisplayName>
              <PublisherDisplayName>Desktopr</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
            </Properties>
            <Resources><Resource Language="en-us" /></Resources>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.19041.0" MaxVersionTested="10.0.19041.0" />
            </Dependencies>
            <Capabilities><rescap:Capability Name="runFullTrust" /></Capabilities>
            <Applications>
              <Application Id="App" Executable="app\example.exe" uap10:RuntimeBehavior="packagedClassicApp" uap10:TrustLevel="mediumIL">
                <uap:VisualElements DisplayName="Sign Test" Description="Sign Test" BackgroundColor="#ffffff"
                  Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png" />
              </Application>
            </Applications>
          </Package>
          "@ | Set-Content -Path "$root/AppxManifest.xml" -Encoding utf8

            $makepri = Get-SdkTool "makepri.exe"
            Push-Location $root
            try {
              & $makepri createconfig /cf priconfig.xml /dq en-US /o | Out-Null
              & $makepri new /pr $root /cf (Join-Path $root "priconfig.xml") /o | Out-Null
              Remove-Item priconfig.xml
            } finally { Pop-Location }

            $makeappx = Get-SdkTool "makeappx.exe"
            & $makeappx pack /d $root /p $Output /o | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "makeappx failed for $Output ($LASTEXITCODE)" }
          }

          New-Msix -Publisher $env:SUBJECT -Output "fixture\matching.msix"
          New-Msix -Publisher "CN=Somebody Else" -Output "fixture\mismatching.msix"
          Get-ChildItem fixture | Format-Table Name, Length

      - name: Sign the fixtures
        id: sign
        uses: ./.github/actions/sign
        with:
          artifacts: fixture
          windows_certificate: ${{ steps.certificate.outputs.certificate }}
          windows_certificate_password: desktopr-test

      - name: Check the result
        shell: pwsh
        env:
          SUBJECT: ${{ steps.certificate.outputs.subject }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-Signed([string]$Path, [bool]$Expected) {
            $signature = Get-AuthenticodeSignature $Path
            $isSigned = $signature.Status -eq 'Valid'
            Write-Host "$([IO.Path]::GetFileName($Path)): status=$($signature.Status) signer=$($signature.SignerCertificate.Subject)"
            if ($isSigned -ne $Expected) {
              throw "$Path : expected signed=$Expected, got status $($signature.Status)"
            }
            if ($isSigned -and $signature.SignerCertificate.Subject -ne $env:SUBJECT) {
              throw "$Path : signed by the wrong certificate"
            }
          }

          Assert-Signed "fixture\example.exe" $true
          Assert-Signed "fixture\matching.msix" $true
          # Windows refuses a package signed by anyone but its own publisher, so
          # the action must leave this one alone instead of producing a bad file.
          Assert-Signed "fixture\mismatching.msix" $false

          if ("${{ steps.sign.outputs.signed }}" -ne "2") {
            throw "expected the action to report 2 signed artifacts, got '${{ steps.sign.outputs.signed }}'"
          }
          Write-Host "OK: executable and matching package signed, mismatching package skipped"

  nothing-to-sign-on-linux:
    name: no-op on Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the sign action on a Linux runner
        uses: ./.github/actions/sign
        with:
          artifacts: src-tauri/standalone
