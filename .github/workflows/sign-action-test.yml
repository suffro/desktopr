# Temporary verification of the sign action and of the build action's
# sign: false switch. Not meant to stay on main.

name: sign-action-test

# A push trigger, because workflow_dispatch only works for workflows that are
# already on the default branch.
on:
  push:
    branches: [sign-action]

permissions:
  contents: read

jobs:
  sign-a-real-app:
    name: sign and notarize a .app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # A minimal but genuine .app: a real Mach-O binary in a real bundle, so
      # codesign and Apple's notary service see what they normally see.
      - name: Build a fixture app
        run: |
          set -euo pipefail
          app="fixture/Example.app"
          mkdir -p "$app/Contents/MacOS"
          printf 'int main(void){return 0;}\n' > "$RUNNER_TEMP/main.c"
          clang -o "$app/Contents/MacOS/Example" "$RUNNER_TEMP/main.c"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Example</string>
            <key>CFBundleIdentifier</key><string>app.desktopr.signfixture</string>
            <key>CFBundleName</key><string>Example</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleVersion</key><string>1.0.0</string>
          </dict>
          </plist>
          PLIST
          echo "Unsigned fixture:"
          codesign -dvv "$app" 2>&1 | head -3 || true

      - name: Sign and notarize
        id: sign
        uses: ./.github/actions/sign
        with:
          artifacts: fixture/Example.app
          apple_certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple_signing_identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple_id: ${{ secrets.APPLE_ID }}
          apple_password: ${{ secrets.APPLE_PASSWORD }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}

      - name: Check the result
        run: |
          set -euo pipefail
          app="fixture/Example.app"
          dmg="${{ steps.sign.outputs.dmg }}"
          test -n "$dmg" || { echo "::error::the action reported no disk image"; exit 1; }
          test -f "$dmg" || { echo "::error::disk image missing: $dmg"; exit 1; }

          echo "--- app signature ---"
          codesign -dvv "$app" 2>&1 | grep -E "Authority|TeamIdentifier|flags"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "::error::the app is not Developer ID signed"; exit 1; }

          echo "--- disk image ---"
          xcrun stapler validate "$dmg" \
            || { echo "::error::the disk image is not notarized and stapled"; exit 1; }
          spctl --assess --type open --context context:primary-signature -vv "$dmg"

  build-without-signing:
    name: build with sign false
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Every Apple credential is available to this job, so a build that comes
      # out ad-hoc signed proves the switch wins over the credentials.
      - name: Build
        id: build
        uses: ./
        with:
          app_name: Sign Switch Test
          app_identifier: app.desktopr.signswitch
          app_version: 0.0.3
          sign: false
          smoke_test: false
          upload_artifact: false
          apple_certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple_signing_identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple_id: ${{ secrets.APPLE_ID }}
          apple_password: ${{ secrets.APPLE_PASSWORD }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}

      - name: Check the app is ad-hoc signed, not Developer ID
        run: |
          set -euo pipefail
          dmg="$(find "${{ steps.build.outputs.dist_dir }}" -name '*.dmg' | head -n 1)"
          test -n "$dmg" || { echo "::error::no disk image was produced"; exit 1; }

          mount="$RUNNER_TEMP/mnt"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -readonly >/dev/null
          app="$(find "$mount" -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$app" || { echo "::error::no app inside the disk image"; exit 1; }

          signature="$(codesign -dvv "$app" 2>&1 || true)"
          echo "$signature" | grep -E "Signature|Authority" || true
          hdiutil detach "$mount" >/dev/null

          if echo "$signature" | grep -q "Authority=Developer ID Application"; then
            echo "::error::sign: false was ignored, the app is Developer ID signed"
            exit 1
          fi
          echo "$signature" | grep -q "Signature=adhoc" \
            || { echo "::error::expected an ad-hoc signature"; exit 1; }
          echo "OK: ad-hoc signed, as sign: false requires"

  nothing-to-sign-on-linux:
    name: no-op on Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run the sign action on a Linux runner
        uses: ./.github/actions/sign
        with:
          artifacts: src-tauri/standalone
