# Builds Desktopr for Linux, Windows and macOS on GitHub-hosted runners.
#
# The per-platform build lives in the composite action .github/actions/build,
# which this workflow calls once per runner. A repository that keeps its web
# application elsewhere can use that action directly instead of this workflow:
# see .github/actions/build/action.yml and
# docs/guide/configuration/github-actions.md.
#
# Outputs are GitHub Actions artifacts and, optionally, a GitHub Release.
# Nothing is uploaded anywhere else.
#
# Signing is optional and driven only by secrets of the repository running (or
# calling) this workflow. When a platform's secrets are absent its build is
# unsigned; macOS builds are then ad-hoc signed. Partial secret sets fail early.
#
#   Windows:  WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#   macOS:    APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#             APPLE_SIGNING_IDENTITY
#   Notarize: APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
#   Updater:  TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#
# The updater is built only when both update_endpoint and updater_public_key are
# provided (inputs, or the DESKTOPR_UPDATE_ENDPOINT / TAURI_SIGNING_PUBLIC_KEY
# repository variables), and then requires TAURI_SIGNING_PRIVATE_KEY.
#
# An MSIX package (Microsoft Store / sideloading) is added to the Windows build
# when msix_identity_name, msix_identity_publisher, msix_publisher_display_name
# and msix_display_name are all provided. The values come from Partner Center
# and are not secret. The MSIX is signed only when the Windows certificate
# subject matches msix_identity_publisher; Store submissions are signed by the
# Store.
#
# frontend=bundled embeds a web application already built in this checkout
# (frontend_dist); frontend=companion bundles the Desktopr Companion app from
# apps/companion instead of the standalone page, and companion-release.yml runs
# it with the published companion identity. release_tag_prefix and
# release_notes_file let several apps publish releases from this repository.

name: build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated platforms: linux, windows, macos"
        type: string
        default: "linux,windows,macos"
      app_name:
        description: "Product name and main window title"
        type: string
        default: "Desktopr"
      app_identifier:
        description: "Bundle identifier (reverse domain)"
        type: string
        default: "app.desktopr.app"
      app_version:
        description: "App version (X.Y.Z). Empty uses the configuration default."
        type: string
        default: ""
      frontend:
        description: "Bundled frontend: standalone (fallback page or app_url), bundled (frontend_dist) or companion"
        type: choice
        options: [standalone, bundled, companion]
        default: standalone
      frontend_dist:
        description: "With frontend=bundled: directory of the built web app in this checkout"
        type: string
        default: ""
      app_url:
        description: "External web app URL. Empty loads the bundled standalone page."
        type: string
        default: ""
      icon:
        description: "Repository path of the square source icon (PNG or SVG)"
        type: string
        default: "src-tauri/icons/icon.png"
      deeplink_scheme:
        description: "Deep link scheme. Empty keeps the configuration default."
        type: string
        default: ""
      update_endpoint:
        description: "Updater HTTPS endpoint. Empty disables the updater unless the repository variable is set."
        type: string
        default: ""
      updater_public_key:
        description: "Updater public key. Empty uses the repository variable, if any."
        type: string
        default: ""
      msix_identity_name:
        description: "MSIX: Package/Identity/Name from Partner Center. Empty skips MSIX."
        type: string
        default: ""
      msix_identity_publisher:
        description: "MSIX: Package/Identity/Publisher (CN=...)"
        type: string
        default: ""
      msix_publisher_display_name:
        description: "MSIX: Publisher display name"
        type: string
        default: ""
      msix_display_name:
        description: "MSIX: Package display name reserved for the listing"
        type: string
        default: ""
      msix_background_color:
        description: "MSIX: Tile background color"
        type: string
        default: "#ffffff"
      msix_short_name:
        description: "MSIX: Optional tile short name"
        type: string
        default: ""
      release:
        description: "Create a GitHub Release from the artifacts"
        type: boolean
        default: false
      release_draft:
        description: "Create the release as a draft"
        type: boolean
        default: true
      release_tag_prefix:
        description: "Release tag prefix; the tag is <prefix><app_version>"
        type: string
        default: "v"
      release_notes_file:
        description: "Repository path of the release notes. Empty generates notes from commits."
        type: string
        default: ""
  workflow_call:
    inputs:
      platforms:
        type: string
        default: "linux,windows,macos"
      app_name:
        type: string
        default: "Desktopr"
      app_identifier:
        type: string
        default: "app.desktopr.app"
      app_version:
        type: string
        default: ""
      frontend:
        type: string
        default: standalone
      frontend_dist:
        type: string
        default: ""
      app_url:
        type: string
        default: ""
      icon:
        type: string
        default: "src-tauri/icons/icon.png"
      deeplink_scheme:
        type: string
        default: ""
      update_endpoint:
        type: string
        default: ""
      updater_public_key:
        type: string
        default: ""
      msix_identity_name:
        type: string
        default: ""
      msix_identity_publisher:
        type: string
        default: ""
      msix_publisher_display_name:
        type: string
        default: ""
      msix_display_name:
        type: string
        default: ""
      msix_background_color:
        type: string
        default: "#ffffff"
      msix_short_name:
        type: string
        default: ""
      release:
        type: boolean
        default: false
      release_draft:
        type: boolean
        default: true
      release_tag_prefix:
        type: string
        default: "v"
      release_notes_file:
        type: string
        default: ""
    secrets:
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  TAURI_CLI_VERSION: "2.11.1"
  NODE_VERSION: "22"

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      updater: ${{ steps.validate.outputs.updater }}
    steps:
      - name: Validate inputs
        id: validate
        shell: bash
        env:
          APP_VERSION: ${{ inputs.app_version }}
          APP_URL: ${{ inputs.app_url }}
          FRONTEND: ${{ inputs.frontend }}
          FRONTEND_DIST: ${{ inputs.frontend_dist }}
          UPDATE_ENDPOINT: ${{ inputs.update_endpoint || vars.DESKTOPR_UPDATE_ENDPOINT }}
          UPDATER_PUBLIC_KEY: ${{ inputs.updater_public_key || vars.TAURI_SIGNING_PUBLIC_KEY }}
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASE: ${{ inputs.release }}
          RELEASE_TAG_PREFIX: ${{ inputs.release_tag_prefix }}
          MSIX_IDENTITY_NAME: ${{ inputs.msix_identity_name }}
          MSIX_IDENTITY_PUBLISHER: ${{ inputs.msix_identity_publisher }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ inputs.msix_publisher_display_name }}
          MSIX_DISPLAY_NAME: ${{ inputs.msix_display_name }}
          MSIX_BACKGROUND_COLOR: ${{ inputs.msix_background_color }}
        run: |
          set -euo pipefail

          msix_fields=0
          for v in MSIX_IDENTITY_NAME MSIX_IDENTITY_PUBLISHER MSIX_PUBLISHER_DISPLAY_NAME MSIX_DISPLAY_NAME; do
            [ -n "${!v}" ] && msix_fields=$((msix_fields + 1))
          done
          if [ "$msix_fields" -ne 0 ] && [ "$msix_fields" -ne 4 ]; then
            echo "::error::MSIX requires msix_identity_name, msix_identity_publisher, msix_publisher_display_name and msix_display_name"
            exit 1
          fi
          if [ "$msix_fields" -eq 4 ]; then
            if [ -n "$APP_VERSION" ] && ! printf '%s' "$APP_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::MSIX requires a numeric X.Y.Z app_version"
              exit 1
            fi
            if ! printf '%s' "$MSIX_IDENTITY_PUBLISHER" | grep -Eq '^CN='; then
              echo "::error::msix_identity_publisher must be a distinguished name starting with CN="
              exit 1
            fi
            if [ -n "$MSIX_BACKGROUND_COLOR" ] && ! printf '%s' "$MSIX_BACKGROUND_COLOR" | grep -Eq '^(#[0-9A-Fa-f]{6}|transparent)$'; then
              echo "::error::msix_background_color must be #RRGGBB or transparent"
              exit 1
            fi
          fi

          if [ -n "$APP_VERSION" ] && ! printf '%s' "$APP_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'; then
            echo "::error::app_version must be X.Y.Z (optionally with a pre-release or build suffix)"
            exit 1
          fi

          if [ "$RELEASE" = "true" ] && [ -z "$APP_VERSION" ]; then
            echo "::error::app_version is required when release is enabled"
            exit 1
          fi

          case "$FRONTEND" in
            standalone)
              if [ -n "$FRONTEND_DIST" ]; then
                echo "::error::frontend_dist requires frontend=bundled"
                exit 1
              fi
              ;;
            bundled)
              if [ -z "$FRONTEND_DIST" ]; then
                echo "::error::frontend=bundled requires frontend_dist"
                exit 1
              fi
              if [ -n "$APP_URL" ]; then
                echo "::error::frontend=bundled serves its own files and cannot be combined with app_url"
                exit 1
              fi
              ;;
            companion)
              if [ -n "$APP_URL" ] || [ -n "$FRONTEND_DIST" ]; then
                echo "::error::frontend=companion bundles its own UI and cannot be combined with app_url or frontend_dist"
                exit 1
              fi
              ;;
            *) echo "::error::frontend must be standalone, bundled or companion"; exit 1 ;;
          esac

          if [ "$RELEASE" = "true" ] && ! printf '%s' "$RELEASE_TAG_PREFIX" | grep -Eq '^[A-Za-z0-9._-]*$'; then
            echo "::error::release_tag_prefix may only contain letters, digits, '.', '_' and '-'"
            exit 1
          fi

          if [ -n "$APP_URL" ] && ! printf '%s' "$APP_URL" | grep -Eq '^https?://[^/]+'; then
            echo "::error::app_url must be an absolute HTTP(S) URL"
            exit 1
          fi

          updater=false
          if [ -n "$UPDATE_ENDPOINT" ] || [ -n "$UPDATER_PUBLIC_KEY" ]; then
            if [ -z "$UPDATE_ENDPOINT" ] || [ -z "$UPDATER_PUBLIC_KEY" ]; then
              echo "::error::The updater requires both update_endpoint and updater_public_key"
              exit 1
            fi
            if [ -z "$UPDATER_PRIVATE_KEY" ]; then
              echo "::error::The updater requires the TAURI_SIGNING_PRIVATE_KEY secret"
              exit 1
            fi
            updater=true
          fi
          echo "updater=$updater" >> "$GITHUB_OUTPUT"

      - name: Resolve platform matrix
        id: matrix
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail

          include='[]'
          for platform in $(printf '%s' "$PLATFORMS" | tr ',' ' '); do
            case "$platform" in
              linux)   os=ubuntu-22.04 ;;
              windows) os=windows-latest ;;
              macos)   os=macos-latest ;;
              *) echo "::error::Unknown platform: $platform"; exit 1 ;;
            esac
            include="$(jq -c --arg p "$platform" --arg os "$os" '. + [{platform: $p, os: $os}] | unique' <<<"$include")"
          done

          if [ "$(jq length <<<"$include")" -eq 0 ]; then
            echo "::error::No platform selected"
            exit 1
          fi

          echo "matrix=$include" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Every build step lives in the composite action, so this workflow and a
      # workflow in someone else's repository build the app the same way.
      - name: Build the app
        uses: ./.github/actions/build
        with:
          app_name: ${{ inputs.app_name }}
          app_identifier: ${{ inputs.app_identifier }}
          app_version: ${{ inputs.app_version }}
          frontend: ${{ inputs.frontend }}
          frontend_dist: ${{ inputs.frontend_dist }}
          app_url: ${{ inputs.app_url }}
          icon: ${{ inputs.icon }}
          deeplink_scheme: ${{ inputs.deeplink_scheme }}
          update_endpoint: ${{ inputs.update_endpoint || vars.DESKTOPR_UPDATE_ENDPOINT }}
          updater_public_key: ${{ inputs.updater_public_key || vars.TAURI_SIGNING_PUBLIC_KEY }}
          msix_identity_name: ${{ inputs.msix_identity_name }}
          msix_identity_publisher: ${{ inputs.msix_identity_publisher }}
          msix_publisher_display_name: ${{ inputs.msix_publisher_display_name }}
          msix_display_name: ${{ inputs.msix_display_name }}
          msix_background_color: ${{ inputs.msix_background_color }}
          msix_short_name: ${{ inputs.msix_short_name }}
          artifact_name: desktopr-${{ matrix.platform }}
          node_version: ${{ env.NODE_VERSION }}
          tauri_cli_version: ${{ env.TAURI_CLI_VERSION }}
          windows_certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          windows_certificate_password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          apple_certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple_signing_identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple_id: ${{ secrets.APPLE_ID }}
          apple_password: ${{ secrets.APPLE_PASSWORD }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}
          tauri_signing_private_key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri_signing_private_key_password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  release:
    name: release
    needs: build
    if: inputs.release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        if: inputs.release_notes_file != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          path: source
          sparse-checkout: ${{ inputs.release_notes_file }}
          sparse-checkout-cone-mode: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktopr-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_NAME: ${{ inputs.app_name }}
          APP_VERSION: ${{ inputs.app_version }}
          DRAFT: ${{ inputs.release_draft }}
          TAG_PREFIX: ${{ inputs.release_tag_prefix }}
          NOTES_FILE: ${{ inputs.release_notes_file }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail

          # GitHub replaces spaces in asset names with dots, so rename the files
          # and the SHA256SUMS entries to what downloads will actually be called.
          for path in dist/*; do
            name="$(basename "$path")"
            renamed="${name// /.}"
            [ "$name" = "$renamed" ] || mv "$path" "dist/$renamed"
          done
          for sums in dist/SHA256SUMS-*.txt; do
            awk '{hash=$1; $1=""; sub(/^[ ]*/,""); sub(/^\*/,""); gsub(/ /,"."); print hash "  " $0}' \
              "$sums" > "$sums.tmp"
            mv "$sums.tmp" "$sums"
          done
          (cd dist && if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS-*.txt; else shasum -a 256 -c SHA256SUMS-*.txt; fi)

          args=(--title "$APP_NAME v$APP_VERSION" --target "$TARGET")
          if [ -n "$NOTES_FILE" ]; then
            test -s "source/$NOTES_FILE" || { echo "::error::Release notes not found: $NOTES_FILE"; exit 1; }
            args+=(--notes-file "source/$NOTES_FILE")
          else
            args+=(--generate-notes)
          fi
          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          fi

          gh release create "${TAG_PREFIX}${APP_VERSION}" "${args[@]}" dist/*
