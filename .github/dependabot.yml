# Keeps the SHA-pinned GitHub Actions up to date through weekly pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  # Composite actions are not covered by the repository root entry.
  - package-ecosystem: github-actions
    directory: /.github/actions/build
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
